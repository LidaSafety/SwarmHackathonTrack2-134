# OpenRouter pilot: 8 agents, complete vs star, one model (~$0.05). Needs OPENROUTER_API_KEY.
base:
  rounds: 12
  pressure: high
model_mixes:
  deepseek:
    - {name: dsv4flash, backend: openai, base_url: "https://openrouter.ai/api/v1", api_key_env: OPENROUTER_API_KEY, model: deepseek/deepseek-v4-flash, max_tokens: 8000, extra_body: {reasoning: {effort: low}}, price_in: 0.091, price_out: 0.182}
grid:
  model_mix: [deepseek]
  n_agents: [8]
  topology: [complete, star]
  board: [hinted, announced]
  seed: [0]
