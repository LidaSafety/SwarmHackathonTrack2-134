# Q2 over-refusal control: identical lookups, benign stated purpose (run with --out runs/decomp_main)
base: {scenario: benign, intent: shown}
model_mixes:
  gemflash: [{name: gem38flash, backend: openai, base_url: "https://openrouter.ai/api/v1", api_key_env: OPENROUTER_API_KEY, max_tokens: 12000, extra_body: {reasoning: {effort: low}}, model: google/gemini-3.8-flash, price_in: 0.825, price_out: 4.125}]
  dsflash: [{name: dsv4flash, backend: openai, base_url: "https://openrouter.ai/api/v1", api_key_env: OPENROUTER_API_KEY, max_tokens: 12000, extra_body: {reasoning: {effort: low}}, model: deepseek/deepseek-v4-flash, price_in: 0.091, price_out: 0.182}]
  gptnano: [{name: gpt5nano, backend: openai, base_url: "https://openrouter.ai/api/v1", api_key_env: OPENROUTER_API_KEY, max_tokens: 8000, extra_body: {reasoning: {effort: low}}, model: openai/gpt-5-nano, price_in: 0.05, price_out: 0.40}]
  qwenflash: [{name: qwen37flash, backend: openai, base_url: "https://openrouter.ai/api/v1", api_key_env: OPENROUTER_API_KEY, max_tokens: 8000, extra_body: {reasoning: {effort: low}}, model: qwen/qwen3.7-flash, price_in: 0.03, price_out: 0.13}]
  dspro: [{name: dsv4pro, backend: openai, base_url: "https://openrouter.ai/api/v1", api_key_env: OPENROUTER_API_KEY, max_tokens: 12000, extra_body: {reasoning: {effort: low}}, model: deepseek/deepseek-v4-pro, price_in: 1.6, price_out: 3.2}]
grid:
  model_mix: [gemflash, dsflash, gptnano, qwenflash, dspro]
  condition: [whole, split, orchestrator]
  seed: [0, 1, 2, 3, 4]
