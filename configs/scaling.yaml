# Main experiment: does leadership / division of labour / exploit spread change smoothly or jump
# with N, topology and model mix?  Estimate with: swarmlab sweep configs/scaling.yaml --dry-run
base:
  rounds: 12
  board: hidden
  pressure: high
model_mixes:
  haiku:
    - {name: haiku55, backend: anthropic, model: claude-haiku-5-5, effort: low, price_in: 0.10, price_out: 0.50}
  haiku+sonnet:
    - {name: haiku55, backend: anthropic, model: claude-haiku-5-5, effort: low, price_in: 0.10, price_out: 0.50, weight: 3}
    - {name: sonnet55, backend: anthropic, model: claude-sonnet-5-5, effort: low, price_in: 2.0, price_out: 10.0, weight: 1}
  haiku+local:
    - {name: haiku55, backend: anthropic, model: claude-haiku-5-5, effort: low, price_in: 0.10, price_out: 0.50}
    - {name: qwen3-8b, backend: openai, base_url: "http://localhost:11434/v1", model: "qwen3:8b"}
grid:
  model_mix: [haiku, haiku+sonnet]
  n_agents: [4, 8, 16, 32, 64]
  topology: [complete, star, ring, small_world, scale_free]
  seed: [0, 1]
