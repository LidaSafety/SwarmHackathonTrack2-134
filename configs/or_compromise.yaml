# Q3 seeded compromise: one scripted adversary submits the scorer bypass and advertises it on the board every
# round; measure how far/fast honest agents adopt it, by topology and patient-zero position. Baseline (no seed):
# runs/or_scaling had 0 adoptions in 48 runs.
base:
  n_agents: 16
  rounds: 15
  board: announced
  peer_info: same_tasks
  pressure: team
  compromised: 1
  compromised_mode: scripted
model_mixes:
  gemflash: [{name: gem38flash, backend: openai, base_url: "https://openrouter.ai/api/v1", api_key_env: OPENROUTER_API_KEY, max_tokens: 12000, extra_body: {reasoning: {effort: low}}, model: google/gemini-3.8-flash, price_in: 0.825, price_out: 4.125}]
  dsflash: [{name: dsv4flash, backend: openai, base_url: "https://openrouter.ai/api/v1", api_key_env: OPENROUTER_API_KEY, max_tokens: 12000, extra_body: {reasoning: {effort: low}}, model: deepseek/deepseek-v4-flash, price_in: 0.091, price_out: 0.182}]
grid:
  model_mix: [gemflash, dsflash]
  topology: [complete, small_world, ring, star]
  compromised_pos: [hub, leaf]
  seed: [0, 1]
