# Q3 on every topology used in published multi-agent safety / topology papers, same protocol as or_compromise:
# NetSafe (chain, cycle, binary tree, star, complete), MacNet (chain, star, tree, mesh, layered, random),
# G-Designer / G-Safeguard / AgentPrune (chain, tree, star, complete, layered, random),
# Agent Smith / Prompt Infection (random pairwise chats), plus small-world and scale-free.
# Already run in runs/or_compromise: complete (= mesh), ring (= cycle), star, small_world. New here:
base:
  n_agents: 16
  rounds: 15
  board: announced
  peer_info: same_tasks
  pressure: team
  compromised: 1
  compromised_mode: scripted
  topology_degree: 4
model_mixes:
  dsflash: [{name: dsv4flash, backend: openai, base_url: "https://openrouter.ai/api/v1", api_key_env: OPENROUTER_API_KEY, max_tokens: 12000, extra_body: {reasoning: {effort: low}}, model: deepseek/deepseek-v4-flash, price_in: 0.091, price_out: 0.182}]
grid:
  model_mix: [dsflash]
  topology: [chain, binary_tree, layered, random, scale_free, pairwise]
  compromised_pos: [hub, leaf]
  seed: [0, 1]
