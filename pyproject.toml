[project]
name = "swarmlab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "linhlt-it-ee", email = "linhlt.it.ee@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.4.0",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "openai>=3.43.0",
    "pandas>=3.1.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
swarmlab = "swarmlab.cli:main"
